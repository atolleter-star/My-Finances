name: Deploy Next.js to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup GitHub Pages settings
        uses: actions/configure-pages@v5
      - name: Install dependencies and compile site
        run: |
          cd dashboard
          npm install
          npm run build
      - name: Upload artifact files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy compilation live
        id: deployment
        uses: actions/deploy-pages@v4
